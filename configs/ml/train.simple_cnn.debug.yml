schema_version: phase_id_xcorr.ml_train.v1

dataset_manifest_path: reports/ml/datasets/data_march2026_balanced_3scansEach/manifest.json
output_dir: reports/ml/runs/simple_cnn_debug

seed: 7
device: cpu
amp: false

batch_size: 8
num_workers: 0
epochs: 3
learning_rate: 0.001
weight_decay: 0.0001

max_train_samples: 24
max_val_samples: 12
max_test_samples: 12

input:
  resize_hw: [64, 64]
  apply_circular_mask: true
  normalize:
    mean: [0.5]
    std: [0.25]

model:
  family: simple_cnn
  width: 16
  in_chans: 1

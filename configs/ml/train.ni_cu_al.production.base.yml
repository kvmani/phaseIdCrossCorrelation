schema_version: phase_id_xcorr.ml_train.v1

dataset_manifest_path: reports/ml/datasets/ni_cu_al_production/manifest.json
output_dir: reports/ml/runs/ni_cu_al_production/base

seed: 42
device: auto
amp: true

batch_size: 16
num_workers: 0
epochs: 15
learning_rate: 0.0005
weight_decay: 0.0001

input:
  resize_hw: [128, 128]
  apply_circular_mask: true
  normalize:
    mean: [0.5]
    std: [0.25]

model:
  family: simple_cnn
  width: 16
  in_chans: 1

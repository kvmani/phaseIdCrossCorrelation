schema_version: phase_id_xcorr.ml_dataset_prep.v3
input_mode: single_phase_scan_map
output_dir: reports/ml/datasets/classiication_training_data_filtered
strict_pattern_presence: true

data_source_folder: data/classiication_training_data
allow_filename_phase_fallback: false

phase_to_label:
  Al: 0
  Ni: 1
  Cu: 2

listOfFiles:
  - file: Al_cropped.oh5
    scan_id: al_cropped
    phase_name: Al
  - file: Ni_cropped.oh5
    scan_id: ni_cropped
    phase_name: Ni
  - file: Cu_cropped.oh5
    scan_id: cu_cropped
    phase_name: Cu

quality_filters:
  expression: "CI > 0.4 && Fit < 1.5"

preprocessing:
  resize_hw: [128, 128]
  apply_circular_mask: true
  normalize_mode: per_pattern_minmax

split:
  train: 0.7
  val: 0.15
  test: 0.15
  seed: 42
  stratified: true
  val_samples_per_phase: 3
  test_samples_per_phase: 3

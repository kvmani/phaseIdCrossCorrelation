schema_version: phase_id_xcorr.ml_dataset_prep.v3
input_mode: single_phase_scan_map
output_dir: reports/ml/datasets/ni_cu_al_production_explorer

data_source_folder: 'F:\PhaseID_Training_Data\Ni-Cu-Al_Scans'
allow_filename_phase_fallback: false

phase_to_label:
  Al: 0
  Ni: 1
  Cu: 2

listOfFiles:
  - file: Al-1.oh5
    scan_id: al_1
    phase_name: Al
  - file: Ni.oh
    scan_id: ni_1
    phase_name: Ni
  - file: Cu-1.oh5
    scan_id: cu_1
    phase_name: Cu

explorer:
  intensity_plot:
    bins: 512
    x_min: 0
    x_max: 65535
    y_min: 0
    # y_max: 120000
    show_cdf: false
    title_template: "{phase}"
    x_label: Intensity
    y_label: Pixel count
    color: "#1f77b4"
    edge_color: "#1f77b4"
    bar_line_width: 0.8
  attribute_plot:
    bins: 80
    y_min: 0
    title_template: "{phase} {attribute}"
    x_label_template: "{attribute}"
    y_label: Pixel count
    color: "#2ca02c"
    edge_color: "#2ca02c"
    bar_line_width: 0.8
    field_ranges:
      CI: [0, 1]
      Fit: [0, 2]
    # field_y_ranges:
    #   CI: [0, 150000]
  export:
    dpi: 400
    figure_size_inches: [8.5, 5.5]
    font_family: Arial
    font_size: 18
    title_font_size: 20
    label_font_size: 18
    tick_label_size: 16
    x_tick_label_size: 16
    y_tick_label_size: 16
    tick_width: 1.2
    tick_length: 6
    minor_tick_width: 0.9
    minor_tick_length: 3.5
    tick_direction: out
    x_tick_rotation: 0
    y_tick_rotation: 0
    spine_line_width: 1.2
    grid_line_width: 0.8
    grid_alpha: 0.25
    title_pad: 10
    label_pad: 8
    figure_facecolor: white
    axes_facecolor: white
    show_minor_ticks: false
    savefig_pad_inches: 0.1
    attributes: [CI, IQ, Fit]

schema_version: phase_id_xcorr.ml_dataset_prep.v3
input_mode: single_phase_scan_map
output_dir: reports/ml/datasets/ni_cu_al_production_explorer

data_source_folder: 'F:\PhaseID_Training_Data\Ni-Cu-Al_Scans'
allow_filename_phase_fallback: false

phase_to_label:
  Al: 0
  Ni: 1
  Cu: 2

listOfFiles:
  - file: Al-1.oh5
    scan_id: al_1
    phase_name: Al
  - file: Ni.oh
    scan_id: ni_1
    phase_name: Ni
  - file: Cu-1.oh5
    scan_id: cu_1
    phase_name: Cu

explorer:
  intensity_plot:
    bins: 512
    x_min: 0
    x_max: 65535
    show_cdf: false
  attribute_plot:
    bins: 80
    field_ranges:
      CI: [0, 1]
      Fit: [0, 2]

# Diagnostic gallery template.
# Replace the run_dir and source file paths with your local trained model and scans.

gallery_title: Diagnostic Pattern Gallery
output_dir: reports/ml/diagnostic_gallery/example
#run_dir: reports/ml/benchmarks/data_march2026_balanced/simple_cnn_w32
#run_dir: reports/ml/benchmarks/data_march2026_balanced/efficientnet_b0_scratch
run_dir: reports/ml/benchmarks/data_march2026_balanced/resnet18_scratch
checkpoint: best_checkpoint.pt
device: auto

sampling:
  patterns_per_source: 5
  seed: 7
  strategy: random

quality_filters:
  expression: CI > 0.5 && Fit < 1.5

prediction_filters:
  min_confidence: 0.5
  min_margin: 0.15

source_groups:
  reference:
    - file: F:\PhaseID_Training_Data\Data_March2026/Al-2_1.oh5
      scan_id: Al-2_1
      phase_name: Al
    - file: F:\PhaseID_Training_Data\Data_March2026/Cu-2_1.oh5
      scan_id: Cu-2_1
      phase_name: Cu
    - file: F:\PhaseID_Training_Data\Data_March2026/Ni-2_1.oh5
      scan_id: Ni-2_1
      phase_name: Ni
  unknown:
    - file: F:\PhaseID_Training_Data\Data_March2026/Data_1.oh5
      scan_id: data1
    - file: F:\PhaseID_Training_Data\Data_March2026/Data_2.oh5
      scan_id: data2
    - file: F:\PhaseID_Training_Data\Data_March2026/Data_3.oh5
      scan_id: data3


schema_version: phase_id_xcorr.ml_benchmark_suite.v1

output_root: reports/ml/benchmarks/classiication_training_data_smoke
base_train_config: configs/ml/train.classiication_training_data.smoke.yml

experiments:
  - name: simple_cnn_w8
    overrides:
      - output_dir=reports/ml/benchmarks/classiication_training_data_smoke/simple_cnn_w8
      - epochs=2
      - model.family=simple_cnn
      - model.width=8
      - seed=11

  - name: simple_cnn_w16
    overrides:
      - output_dir=reports/ml/benchmarks/classiication_training_data_smoke/simple_cnn_w16
      - epochs=2
      - model.family=simple_cnn
      - model.width=16
      - seed=13

  - name: resnet18_scratch
    overrides:
      - output_dir=reports/ml/benchmarks/classiication_training_data_smoke/resnet18_scratch
      - epochs=1
      - batch_size=4
      - model.family=timm
      - model.model_name=resnet18
      - model.pretrained=false
      - seed=17

  - name: mobilenetv3_small_scratch
    overrides:
      - output_dir=reports/ml/benchmarks/classiication_training_data_smoke/mobilenetv3_small_scratch
      - epochs=1
      - batch_size=4
      - model.family=timm
      - model.model_name=mobilenetv3_small_100
      - model.pretrained=false
      - seed=19

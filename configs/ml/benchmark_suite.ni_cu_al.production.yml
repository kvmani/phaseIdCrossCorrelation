schema_version: phase_id_xcorr.ml_benchmark_suite.v1

output_root: reports/ml/benchmarks/ni_cu_al_production
base_train_config: configs/ml/train.ni_cu_al.production.base.yml

experiments:
  - name: simple_cnn_w16
    overrides:
      - output_dir=reports/ml/benchmarks/ni_cu_al_production/simple_cnn_w16
      - model.family=simple_cnn
      - model.width=16
      - seed=41

  - name: simple_cnn_w32
    overrides:
      - output_dir=reports/ml/benchmarks/ni_cu_al_production/simple_cnn_w32
      - model.family=simple_cnn
      - model.width=32
      - seed=43

  - name: resnet18_scratch
    overrides:
      - output_dir=reports/ml/benchmarks/ni_cu_al_production/resnet18_scratch
      - batch_size=8
      - model.family=timm
      - model.model_name=resnet18
      - model.pretrained=false
      - seed=47

  - name: mobilenetv3_small_scratch
    overrides:
      - output_dir=reports/ml/benchmarks/ni_cu_al_production/mobilenetv3_small_scratch
      - batch_size=8
      - model.family=timm
      - model.model_name=mobilenetv3_small_100
      - model.pretrained=false
      - seed=53

  - name: efficientnet_b0_scratch
    overrides:
      - output_dir=reports/ml/benchmarks/ni_cu_al_production/efficientnet_b0_scratch
      - batch_size=8
      - model.family=timm
      - model.model_name=efficientnet_b0
      - model.pretrained=false
      - seed=59

<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="980" viewBox="0 0 1680 980">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1680" height="980" fill="#f8fafc"/><text x="840.0" y="62" font-family="Arial" font-size="34" font-weight="700" text-anchor="middle" fill="#111827">CNN-32 Architecture Used in the Current EBSD Phase-Classification Study</text><text x="840.0" y="98" font-family="Arial" font-size="22" font-weight="400" text-anchor="middle" fill="#475569">Exact implementation: SimpleCnnClassifier(width=32), input size 128 x 128, three output classes</text><rect x="70" y="170" width="300" height="170" rx="18" ry="18" fill="#dbeafe" stroke="#1f2937" stroke-width="2.2"/><text x="220.0" y="204" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#111827">Input Pattern</text><text x="220.0" y="246" font-family="Arial" font-size="23" font-weight="400" text-anchor="middle" fill="#111827"><tspan x="220.0" dy="0">1 x 128 x 128 grayscale image</tspan><tspan x="220.0" dy="28">Circular mask enabled</tspan><tspan x="220.0" dy="28">Normalization: mean 0, std 1</tspan></text><text x="220.0" y="374" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle" fill="#334155">Tensor: 1 x 128 x 128</text><rect x="440" y="170" width="300" height="170" rx="18" ry="18" fill="#c7f9cc" stroke="#1f2937" stroke-width="2.2"/><text x="590.0" y="204" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#111827">Feature Block 1</text><text x="590.0" y="246" font-family="Arial" font-size="23" font-weight="400" text-anchor="middle" fill="#111827"><tspan x="590.0" dy="0">Conv 3x3, 1 -> 32</tspan><tspan x="590.0" dy="28">BatchNorm + ReLU</tspan><tspan x="590.0" dy="28">MaxPool 2x2</tspan></text><text x="590.0" y="374" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle" fill="#334155">32 x 64 x 64</text><rect x="810" y="170" width="300" height="170" rx="18" ry="18" fill="#86efac" stroke="#1f2937" stroke-width="2.2"/><text x="960.0" y="204" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#111827">Feature Block 2</text><text x="960.0" y="246" font-family="Arial" font-size="23" font-weight="400" text-anchor="middle" fill="#111827"><tspan x="960.0" dy="0">Conv 3x3, 32 -> 64</tspan><tspan x="960.0" dy="28">BatchNorm + ReLU</tspan><tspan x="960.0" dy="28">MaxPool 2x2</tspan></text><text x="960.0" y="374" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle" fill="#334155">64 x 32 x 32</text><rect x="1180" y="170" width="300" height="170" rx="18" ry="18" fill="#4ade80" stroke="#1f2937" stroke-width="2.2"/><text x="1330.0" y="204" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#111827">Feature Block 3</text><text x="1330.0" y="246" font-family="Arial" font-size="23" font-weight="400" text-anchor="middle" fill="#111827"><tspan x="1330.0" dy="0">Conv 3x3, 64 -> 128</tspan><tspan x="1330.0" dy="28">BatchNorm + ReLU</tspan><tspan x="1330.0" dy="28">AdaptiveAvgPool 1x1</tspan></text><text x="1330.0" y="374" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle" fill="#334155">128 x 1 x 1</text><rect x="310" y="455" width="300" height="170" rx="18" ry="18" fill="#fde68a" stroke="#1f2937" stroke-width="2.2"/><text x="460.0" y="489" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#111827">Flatten</text><text x="460.0" y="531" font-family="Arial" font-size="23" font-weight="400" text-anchor="middle" fill="#111827"><tspan x="460.0" dy="0">Vectorize pooled tensor</tspan><tspan x="460.0" dy="28">No learned parameters</tspan></text><text x="460.0" y="659" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle" fill="#334155">128 features</text><rect x="680" y="455" width="300" height="170" rx="18" ry="18" fill="#fca5a5" stroke="#1f2937" stroke-width="2.2"/><text x="830.0" y="489" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#111827">Linear Head</text><text x="830.0" y="531" font-family="Arial" font-size="23" font-weight="400" text-anchor="middle" fill="#111827"><tspan x="830.0" dy="0">Fully connected layer</tspan><tspan x="830.0" dy="28">128 -> 3 logits</tspan></text><text x="830.0" y="659" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle" fill="#334155">3 logits</text><rect x="1050" y="455" width="300" height="170" rx="18" ry="18" fill="#e9d5ff" stroke="#1f2937" stroke-width="2.2"/><text x="1200.0" y="489" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#111827">Prediction</text><text x="1200.0" y="531" font-family="Arial" font-size="23" font-weight="400" text-anchor="middle" fill="#111827"><tspan x="1200.0" dy="0">Argmax for class label</tspan><tspan x="1200.0" dy="28">Softmax only for reporting</tspan></text><text x="1200.0" y="659" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle" fill="#334155">Al / Cu / Ni</text><path d=" M 378,255.0 L 426,255.0" fill="none" stroke="#334155" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d=" M 748,255.0 L 796,255.0" fill="none" stroke="#334155" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d=" M 1118,255.0 L 1166,255.0" fill="none" stroke="#334155" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d=" M 1330.0,350 L 1330.0,407 L 460.0,407 L 460.0,443" fill="none" stroke="#334155" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d=" M 618,540.0 L 666,540.0" fill="none" stroke="#334155" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d=" M 988,540.0 L 1036,540.0" fill="none" stroke="#334155" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="590" y="386" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle" fill="#334155">Pooling halves spatial resolution</text><text x="1330" y="386" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle" fill="#334155">Global average pooling removes spatial layout</text><text x="860" y="725" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle" fill="#334155">Only the final linear layer performs class scoring</text><rect x="70" y="744" width="620" height="206" rx="20" ry="20" fill="#ffffff" stroke="#1f2937" stroke-width="2.0"/><text x="112" y="782" font-family="Arial" font-size="28" font-weight="700" text-anchor="start" fill="#111827">Legend</text><rect x="98" y="800" width="38" height="24" rx="6" ry="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4"/><text x="154" y="818" font-family="Arial" font-size="22" font-weight="400" text-anchor="start" fill="#111827">Input and preprocessing</text><rect x="98" y="831" width="38" height="24" rx="6" ry="6" fill="#86efac" stroke="#1f2937" stroke-width="1.4"/><text x="154" y="849" font-family="Arial" font-size="22" font-weight="400" text-anchor="start" fill="#111827">Learned convolutional feature extraction</text><rect x="98" y="862" width="38" height="24" rx="6" ry="6" fill="#fde68a" stroke="#1f2937" stroke-width="1.4"/><text x="154" y="880" font-family="Arial" font-size="22" font-weight="400" text-anchor="start" fill="#111827">Tensor reshape</text><rect x="98" y="893" width="38" height="24" rx="6" ry="6" fill="#fca5a5" stroke="#1f2937" stroke-width="1.4"/><text x="154" y="911" font-family="Arial" font-size="22" font-weight="400" text-anchor="start" fill="#111827">Classifier head</text><rect x="98" y="924" width="38" height="24" rx="6" ry="6" fill="#e9d5ff" stroke="#1f2937" stroke-width="1.4"/><text x="154" y="942" font-family="Arial" font-size="22" font-weight="400" text-anchor="start" fill="#111827">Prediction and probability reporting</text><rect x="760" y="748" width="850" height="192" rx="20" ry="20" fill="#ffffff" stroke="#1f2937" stroke-width="2.0"/><text x="792" y="786" font-family="Arial" font-size="28" font-weight="700" text-anchor="start" fill="#111827">Implementation Notes</text><text x="798" y="824" font-family="Arial" font-size="22" font-weight="400" text-anchor="start" fill="#111827">- Source file: src/phase_id_xcorr/ml/models.py</text><text x="798" y="855" font-family="Arial" font-size="22" font-weight="400" text-anchor="start" fill="#111827">- Convolution blocks: Conv2d -> BatchNorm2d -> ReLU</text><text x="798" y="886" font-family="Arial" font-size="22" font-weight="400" text-anchor="start" fill="#111827">- Pooling schedule: MaxPool after blocks 1 and 2, AdaptiveAvgPool after block 3</text><text x="798" y="917" font-family="Arial" font-size="22" font-weight="400" text-anchor="start" fill="#111827">- Classifier output dimension: 3 logits for Al, Cu, and Ni</text></svg>